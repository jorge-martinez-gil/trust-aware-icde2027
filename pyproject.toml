[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-aware"
version = "0.1.0"
description = "Reference implementation for trust-aware query optimization in AI-native data systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trust-Aware Query Optimization Authors" }]
keywords = [
    "query-optimization",
    "trust",
    "ai-native-data-systems",
    "provenance",
    "retrieval-augmented-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/"

[project.scripts]
trust-aware-benchmark = "trust_aware.benchmark:main"

[tool.setuptools.packages.find]
include = ["trust_aware*"]
